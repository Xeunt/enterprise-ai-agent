name: Terraform CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: GitHubActions
          mask-aws-account-id: true

    ##  - name: Verify AWS identity
    ##    run: |
    ##      aws sts get-caller-identity --output json | jq '{Account: .Account, Arn: (.Arn | split(":") | .[0:5] + ["[REDACTED]"] | join(":"))}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Import existing documents bucket
        run: terraform import aws_s3_bucket.documents enterprise-ai-document-agent-docs

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

   